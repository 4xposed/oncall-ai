# oncall-ai default configuration.
# To override you must place a config.toml next to the binary or under $ONCALL_HOME.
# Every key is optional, when a key is not set this defaults apply.

[log]
format = "pretty"   # "pretty" or "json"
level = "info"

[webhook]
bind = "127.0.0.1:8080"
body_limit_bytes = 1048576
body_log_limit_bytes = 65536

[webhook.grafana]
enabled = false

[webhook.pagerduty]
enabled = false

[incidents]
queue_capacity = 256
idle_ttl_secs = 86400

[triage]
model = "ollama:qwen3:8b"
endpoint = "http://localhost:11434"
queue_capacity = 256
timeout_secs = 60
backoff_initial_ms = 1000
backoff_max_ms = 60000

[investigation]
model = "ollama:qwen3.5:27b"
endpoint = "http://localhost:11434"
repo_root = "."
max_turns = 12
timeout_secs = 300
max_file_bytes = 32768
queue_capacity = 256
