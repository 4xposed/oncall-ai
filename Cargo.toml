[package]
name = "oncall-ai"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[lints]
workspace = true

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
config = { version = "0.15", default-features = false, features = ["toml"] }
futures = "0.3"
http = "1"
rig-agent = { version = "0.41", default-features = false }
rig-core = { version = "0.41", default-features = false, features = ["reqwest", "rustls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.37", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time", "fs", "io-util"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
insta = { version = "1", features = ["yaml", "redactions"] }
rig-core = { version = "0.41", default-features = false, features = ["test-utils"] }
tempfile = "3"
tokio = { version = "1.37", features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }

[workspace]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
doc_markdown = "warn"
ignored_unit_patterns = "warn"
missing_errors_doc = "warn"
redundant_closure_for_method_calls = "warn"

string_slice = "warn"
indexing_slicing = "warn"
unwrap_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"
get_unwrap = "warn"
unwrap_in_result = "warn"
unchecked_time_subtraction = "warn"
panic_in_result_fn = "warn"

# Don't Fail Silently - prevent dropped futures and swallowed errors
let_underscore_future = "warn"
let_underscore_must_use = "warn"
unused_result_ok = "warn"
map_err_ignore = "warn"
assertions_on_result_states = "warn"

# Don't Do Bad Async Stuff - prevent deadlocks and concurrency bugs
await_holding_lock = "warn"
await_holding_refcell_ref = "warn"
if_let_mutex = "warn"  # only relevant on editions before 2024
large_futures = "warn"

# Don't Do Unsafe Things with Memory
mem_forget = "warn"
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"
unnecessary_safety_doc = "warn"
unnecessary_safety_comment = "warn"

# Don't Do Potentially Incorrect Things with Numbers
float_cmp = "warn"
float_cmp_const = "warn"
lossy_float_literal = "warn"
cast_sign_loss = "warn"
invalid_upcast_comparisons = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"

# Don't Do Bad Things That are Easy to Avoid
rc_mutex = "warn"
debug_assert_with_mut_call = "warn"
iter_not_returning_iterator = "warn"
expl_impl_clone_on_copy = "warn"
infallible_try_from = "warn"
dbg_macro = "warn"

allow_attributes = "warn"
allow_attributes_without_reason = "warn"
